<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1440 800" preserveAspectRatio="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a18"/>
      <stop offset="50%" stop-color="#0a122c"/>
      <stop offset="100%" stop-color="#020612"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="goldGlow" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#b89047" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#b89047" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blueGlow" cx="20%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#1d3557" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0a122c" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-opacity="0.015" stroke-width="1"/>
    </pattern>

    <!-- Subtle Dots Pattern -->
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Base Fill -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Glow effects -->
  <rect width="100%" height="100%" fill="url(#blueGlow)"/>
  <rect width="100%" height="100%" fill="url(#goldGlow)"/>

  <!-- Patterns -->
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <rect width="100%" height="100%" fill="url(#dots)"/>

  <!-- Abstract Design Lines -->
  <path d="M-100 200 C 300 100, 600 600, 1600 500" fill="none" stroke="#b89047" stroke-opacity="0.08" stroke-width="2"/>
  <path d="M-100 250 C 400 150, 500 550, 1600 450" fill="none" stroke="#b89047" stroke-opacity="0.04" stroke-width="1"/>
  <path d="M-100 600 C 500 400, 900 800, 1600 300" fill="none" stroke="#1e3a8a" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- Decorative Orbits/Circles -->
  <circle cx="70%" cy="30%" r="250" fill="none" stroke="#b89047" stroke-opacity="0.05" stroke-width="1"/>
  <circle cx="70%" cy="30%" r="400" fill="none" stroke="#b89047" stroke-opacity="0.02" stroke-width="1" stroke-dasharray="10 15"/>
</svg>
